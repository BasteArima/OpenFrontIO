# Builds the self-hosted image and publishes it to GHCR as
# ghcr.io/<owner>/openfrontio:{latest,sha-<short>}.
# homesrv polls :latest and redeploys the Portainer stack when it changes.
name: Self-host image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: selfhost-image
  cancel-in-progress: true

jobs:
  build:
    # Only in the fork: upstream has its own release pipeline.
    if: github.repository != 'openfrontio/OpenFrontIO'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - id: commit
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/openfrontio
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: GIT_COMMIT=${{ steps.commit.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
